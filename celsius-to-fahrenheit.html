<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            display: flex;
            flex-direction: row;
            justify-content: center;
            
        }
        .main{
            
            
            border-radius: 20px;
            margin-top: 40px;
            text-align: center;
          

            background-color: beige;
            width: 300px;
            height: 500px;
        }
        h2{
            
            padding: 20px;
            font-size: 40px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        

        .in {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    
    
}
            
        input{
            padding: 5px;
            border: 2px solid black ;
            border-radius: 10px;
        }
        button{
            padding: 5px;
            color: rgb(254, 254, 254);
            background-color: rgb(0, 7, 13);
            font-style: italic;
            border-radius: 20px;

        }
        button:hover{
            color: black;
            background-color: aliceblue;
            font-style: italic;
        }

        
    </style>
</head>
<body>
    <div class="main">
        <h2> celsius to fahrenheit calculator</h2>
        <div class="in">
            <input type="number" id="celsius" placeholder="Enter Celsius">
        <button  onclick="convert()" >Convert</button>
        </div>
        
        <p id="result"></p>

    </div>
    <script>
        function convert(){
            let Celsius=document.getElementById("celsius").value;
            if(Celsius==""){
                alert("Please enter a number");
            }
        let fahrenheit=(Celsius*(9/5))+32;
        document.getElementById("result").innerHTML =
    "<h1>" + fahrenheit + "°F</h1>";
        }
        
    </script>
</body>
</html>
