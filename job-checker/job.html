
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Eligibility</title>

    <style>
        body {
            background-color: rgb(67, 32, 4);
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main {
            border-radius: 20px;
            background-color: white;
            width: 300px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main2 {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>Education Status</h1>

        <div class="main2">
            <div class="option">
                <label for="pg">PG</label>
                <input id="pg" name="education" type="radio" value="PG">
            </div>

            <div class="option">
                <label for="ug">UG</label>
                <input id="ug" name="education" type="radio" value="UG">
            </div>

            <div class="option">
                <label for="highschool">HighSchool</label>
                <input id="highschool" name="education" type="radio" value="HighSchool">
            </div>

            <div class="option">
                <label for="doctorate">Doctorate</label>
                <input id="doctorate" name="education" type="radio" value="Doctorate">
            </div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const inputs = document.querySelectorAll('input[name="education"]');

        inputs.forEach(function(input) {
            input.addEventListener("change", display);
        });

        function display() {
            
            const selected = document.querySelector('input[name="education"]:checked');

            if (!selected) {
                document.getElementById("result").textContent = "Choose any one";
                return;
            }

            const city = selected.value;
            let txt = "";

            switch (city) {
                case "UG":
                    txt = "Eligible for job";
                    break;

                case "HighSchool":
                    txt = "Eligible for job";
                    break;

                case "PG":
                    txt = "Not eligible for job";
                    break;

                case "Doctorate":
                    txt = "Not eligible for job";
                    break;
            }

            document.getElementById("result").textContent = txt;
        }
    </script>
</body>
</html>
