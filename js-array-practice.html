<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

select {
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}
    
    </style>
</head>
<body>
    <select id="department">
        

    </select>
    <script>
        let addoption = function() {
    const list = document.getElementById("department");

    let arr = ['ECE', 'CSE', 'IT', 'EEE', 'MECH', 'CIVIL'];

    arr.forEach((element,index,arr) => {
    let option = document.createElement("option");

    option.textContent = arr[index];

    list.appendChild(option);
});
};


addoption();


// Area of circle


let area = (r) => {
    return r * r * Math.PI;
};

console.log(area(10).toFixed(2));


// Sum of array


let sumnums = (...nums) => {
    let sum = 0;

    for (let s of nums) {
        sum += s;
    }

    return sum;
};
console.log(sumnums(2,3,5,7,8,5));

function* sum() {
    let index = 0;

    while (true) {
        index += 1;
        let value = yield index;
        console.log("received:", value);
    }
}

let su = sum();

console.log(su.next(8));
console.log(su.next(2));
console.log(su.next(5));
        
    </script>
</body>
</html>
