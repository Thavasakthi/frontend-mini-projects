
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>

    <style>
        body {
            background-color: antiquewhite;
            text-align: center;
            font-family: 'Lucida Sans', sans-serif;
        }

        .main {
            border-radius: 20px;
            width: 400px;
            height: 600px;
            background-color: rgb(2, 65, 86);
            color: aliceblue;
            display: inline-block;
        }

        textarea {
            border-radius: 20px;
            padding: 10px;
            margin: 10px;
            width: 300px;
            height: 300px;
            text-align: center;
            resize: none;
        }

        button {
            border: 2px solid black;
            border-radius: 10px;
            color: aliceblue;
            width: 150px;
            padding: 10px;
            background-color: rgb(0, 3, 3);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main">
    <h1>Type a sentence</h1>

    <textarea id="txt" placeholder="Please enter the words"></textarea>

    <br>
    <button onclick="calculator()">Calculate Words</button>

    <h2 id="result"></h2>
</div>

<script>
    function calculator() {
        let msg = document.getElementById("txt").value;

        let caal = msg.trim().split(/\s+/);

        let cal = msg.trim() === "" ? 0 : caal.length;

        document.getElementById("result").textContent =
            "Word Count: " + cal;
    }
</script>

</body>
</html>
